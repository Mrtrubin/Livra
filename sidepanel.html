<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能直播助手</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="brand">
        <span class="logo">DY</span>
        <div class="brand-text">
          <h1>智能直播助手</h1>
          <p class="brand-sub">Livra · 响应改写</p>
        </div>
      </div>
      <span id="badge" class="badge">未开启</span>
    </header>

    <section class="card">
      <div class="card-label">当前标签页</div>
      <div id="tabTitle" class="target-title">正在获取…</div>
      <div id="tabUrl" class="target-url"></div>
    </section>

    <section class="card">
      <div class="switch-row">
        <div class="switch-text">
          <div class="switch-title">改写本页响应</div>
          <div id="switchHint" class="switch-hint">开启后按规则替换命中的响应内容</div>
        </div>
        <button id="toggle" class="switch" type="button" role="switch" aria-checked="false">
          <span class="knob"></span>
        </button>
      </div>
      <div id="notice" class="notice" hidden></div>
    </section>

    <section class="card stats">
      <div class="stat">
        <span class="stat-label">状态</span>
        <strong id="statState">未开启</strong>
      </div>
      <div class="stat">
        <span class="stat-label">已改写</span>
        <strong id="statCount">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">在线人数</span>
        <strong id="statOnline">—</strong>
      </div>
    </section>

    <section class="card live">
      <div class="live-head">
        <h2>直播数据</h2>
        <span id="liveSocket" class="live-socket">未连接</span>
      </div>

      <div id="danmakuEmpty" class="danmaku-empty">还没收到弹幕。确认已经进入直播间并开着这个页面。</div>
      <div id="danmakuList" class="danmaku-list"></div>

      <div class="send-row">
        <input id="danmakuInput" type="text" placeholder="发一条弹幕…" autocomplete="off" maxlength="60">
        <button id="danmakuSend" class="primary" type="button">发送</button>
      </div>
      <div id="sendStatus" class="send-status"></div>
      <div id="liveHint" class="live-hint">消息 0 条</div>
    </section>

    <section class="card">
      <div class="rules-head">
        <h2>改写规则</h2>
        <span class="tag">硬编码在 rewrite.js</span>
      </div>
      <div id="ruleList" class="rule-list"></div>
    </section>

    <footer class="foot">
      <span id="footText">准备就绪</span>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
